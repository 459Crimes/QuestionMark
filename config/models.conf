# ask-cli model configuration
# ---------------------------------------------------------------
# This file is sourced by the `?` wrapper. It controls the default model, the
# automatic fallback model, and the short aliases usable with `? -m:<name>`.
#
# File locations (first found wins):
#   1. $QM_CONFIG_FILE
#   2. ${XDG_CONFIG_HOME:-$HOME/.config}/ask-cli/models.conf
#   3. the copy shipped next to the wrapper (config/models.conf)
#
# Model strings are opencode model ids (see `opencode models`).
#
# Set QM_DEFAULT_MODEL to "default" to let OpenCode pick its own default model
# (the wrapper then passes NO --model flag, i.e. opencode's default mode).
# To pin a model, set it to a full id below.

# Default model. "default" = let opencode decide. Otherwise a full model id.
QM_DEFAULT_MODEL=default

# Automatic fallback when the default model hits a usage/rate limit.
# Only used when you did NOT pass -m: explicitly.
QM_FALLBACK_MODEL=opencode/gpt-5.6-luna
QM_FALLBACK_VARIANT=low

# Model aliases usable with `? -m:<name>`. Edit or extend freely to the
# models available to your opencode account.
QM_ALIAS_luna=openai/gpt-5.6-luna
QM_ALIAS_terra=openai/gpt-5.6-terra
QM_ALIAS_sol=openai/gpt-5.6-sol
QM_ALIAS_deep=deepseek/deepseek-v4-pro
QM_ALIAS_flash=deepseek/deepseek-v4-flash
QM_ALIAS_gemma=openrouter/google/gemma-4-31b-it
QM_ALIAS_opus=anthropic/claude-opus-4
QM_ALIAS_grok=x-ai/grok-4